[package]
name = "crabmusic"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["CrabMusic Contributors"]
description = "Real-time ASCII music visualizer for terminal"
license = "MIT"
repository = "https://github.com/newjordan/crabmusic"
keywords = ["audio", "visualization", "terminal", "music", "ascii"]
categories = ["multimedia::audio", "visualization"]

[dependencies]
# Audio capture
cpal = "0.15"
ringbuf = "0.4.8"
rand = "0.8"

# DSP processing
rustfft = "6.1"
spectrum-analyzer = "1.0"

# Terminal UI
ratatui = "0.26"
crossterm = "0.27"

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# 3D Model Loading
gltf = "1.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime (optional, for config hot-reload)
tokio = { version = "1.35", features = ["fs", "time", "rt-multi-thread", "macros"], optional = true }
ctrlc = "3.5.1"
notify = { version = "7.0.0", features = ["serde"] }
ffmpeg-next = { version = "8.0.0", optional = true }
image = { version = "0.25.6", optional = true }
reqwest = { version = "0.12.24", features = ["blocking"] }
serde_json = "1.0.145"
rustube = "0.6.0"
url = "2.5.0"

# Windows WASAPI for native loopback capture
[target.'cfg(windows)'.dependencies]
wasapi = "0.21"

# Webcam support
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"] }


[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3           # Maximum optimization
lto = "fat"             # Link-time optimization
codegen-units = 1       # Single codegen unit for better optimization
strip = true            # Strip symbols
panic = "abort"         # Smaller binary, faster panic

[features]
default = ["image", "video", "tokio"]
hot-reload = ["tokio"]
video = ["ffmpeg-next", "image"]
ffmpeg-next = ["dep:ffmpeg-next"]
image = ["dep:image"]
tokio = ["dep:tokio"]
legacy-sacred-geometry-demos = []
model-browser-demo = []
internal-raytracer-dev = []

[[example]]
name = "flower_of_life_demo"
required-features = ["legacy-sacred-geometry-demos"]

[[example]]
name = "mandala_demo"
required-features = ["legacy-sacred-geometry-demos"]

[[example]]
name = "sacred_geometry_demo"
required-features = ["legacy-sacred-geometry-demos"]

[[example]]
name = "model_browser"
required-features = ["model-browser-demo"]

[[test]]
name = "gltf_loading_test"
required-features = ["internal-raytracer-dev"]

[[bench]]
name = "fft_benchmark"
harness = false

[[bench]]
name = "render_benchmark"
harness = false

[[bench]]
name = "ring_buffer_benchmark"
harness = false
